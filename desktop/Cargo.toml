[workspace]
resolver = "2"
members = [
    "crates/openay-protocol",
    "crates/openay-transport",
    "crates/openay-codec",
    "crates/openay-jitter",
    "crates/openay-loopback",
    "crates/openay-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Release profile tuned for the latency benchmark (also makes the bench honest:
# the released binary is what the wire latency numbers are measured against).
[profile.release]
opt-level = 3
lto = "thin"
