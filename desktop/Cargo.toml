[workspace]
resolver = "2"
members = [
    "crates/openay-protocol",
    "crates/openay-transport",
    "crates/openay-codec",
    "crates/openay-jitter",
    "crates/openay-loopback",
    "crates/openay-proxy",
    "crates/openay-server",
    "crates/openay-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Release profile tuned for the latency benchmark (also makes the bench honest:
# the released binary is what the wire latency numbers are measured against).
[profile.release]
opt-level = 3
lto = "thin"

[patch.crates-io]
# iced_tiny_skia 0.13.0 clips translated canvas geometry against an
# untranslated (canvas-local) clip mask whenever the fill/stroke bounds fail
# an exact float comparison — which makes stroked circles and some filled
# rects vanish at non-zero window positions (the MIC ring, 7 of the 24 VU
# segments, the ON AIR dot). Vendored with a one-line fix: map the group
# clip through the group transformation before intersecting it with the
# window-space clip. See vendor/iced_tiny_skia/README.md.
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
