[package]
name = "openay-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAY Mic desktop console: tray-resident Iced GUI over the openay-server engine"

[[bin]]
name = "openay-gui"
path = "src/main.rs"

[dependencies]
# The GUI always ships the PipeWire virtual microphone: a network-only
# console would render meters against a silent engine (this exact mismatch
# bit us — see the VU/ring dead-meter fix).
openay-server = { path = "../openay-server", features = ["pipewire"] }
# Software renderer only (tiny-skia, NOT wgpu); tokio integration for the
# async engine commands; canvas for the custom-drawn instruments.
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "tokio", "canvas"] }
ksni = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
dirs = "6"
if-addrs = "0.15"

[dev-dependencies]
# Headless layout probing in unit tests (same version as the iced tree).
iced_core = "0.13"
# Rasterize canvas geometry headlessly (same versions as the iced tree's
# tiny-skia backend) so canvas bugs can be asserted pixel-exactly.
tiny-skia = "0.11"
iced_tiny_skia = "0.13"
