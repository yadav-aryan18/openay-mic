[package]
name = "openay-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lossy (drop/delay/duplicate) UDP proxy for OpenAY Mic's one-way audio stream"

[[bin]]
name = "openay-proxy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "signal", "sync"] }
