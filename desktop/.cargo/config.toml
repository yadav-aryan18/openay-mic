# Runtime library resolution is intentionally NOT configured here: cargo
# config files cannot expand environment variables, and hard-coding an
# absolute rpath (as this file once did) breaks every other machine.
# Instead, scripts/env.sh (created from scripts/env.sh.example) exports
# LD_LIBRARY_PATH pointing at the toolchain env's lib dir (libopus the
# binaries were built against) and the user-space PipeWire build
# (libpipewire). Source that script before running any workspace binary,
# test, or benchmark.
